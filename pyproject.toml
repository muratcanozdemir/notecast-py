[project]
name = "notecast"
version = "0.1.0"
description = "Local note engine — LLM-driven knowledge graph. Ollama-first."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "graphviz>=0.20",
]

[project.scripts]
notecast = "notecast.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
