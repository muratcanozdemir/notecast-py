[project]
name = "notecast"
version = "0.1.0"
description = "Local note engine — LLM-driven knowledge graph. Ollama-first."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "graphviz>=0.20",
]

[project.scripts]
notecast = "notecast.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notecast"]
